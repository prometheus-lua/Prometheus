name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Validate Lua suite
        uses: ./.github/actions/validate

  package:
    name: Package (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
          - runner: macos-latest
            os_name: macos
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT (Linux)
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
      - name: Install LuaJIT (macOS)
        if: matrix.os_name == 'macos'
        run: brew install luajit
      - name: Build package
        run: PROMETHEUS_BUNDLED_LUA="$(command -v luajit)" ./scripts/release/package.sh "${{ matrix.os_name }}" "${GITHUB_REF_NAME}"
      - name: Smoke-test release archive
        env:
          RELEASE_OS: ${{ matrix.os_name }}
        run: bash scripts/release/smoke-test.sh "$RELEASE_OS" "$GITHUB_REF_NAME"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-lua-${{ matrix.os_name }}
          path: dist/prometheus-lua-${{ github.ref_name }}-${{ matrix.os_name }}.tar.gz

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: prometheus-lua-*
      - name: Move release assets
        run: |
          mkdir -p dist/out
          mv dist/prometheus-lua-linux/*.tar.gz dist/out/
          mv dist/prometheus-lua-macos/*.tar.gz dist/out/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/out/*.tar.gz
          generate_release_notes: true
